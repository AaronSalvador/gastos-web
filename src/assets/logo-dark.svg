<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 88" width="240" height="88">
  <defs>
    <!-- Gradiente esmeralda original para el icono -->
    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Sombra suave característica -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Isotipo original (Fondo esmeralda sólido con gráfico blanco) -->
  <g transform="translate(10, 6)" filter="url(#softGlow)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#emeraldGradient)" />
    <path d="M15 38L25 26L35 32L47 16" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="47" cy="16" r="4.5" fill="#ffffff" />
  </g>

  <!-- Texto manteniendo exactamente el tono gris/azulado que te gustó -->
  <text fill="#0f1f1a" x="86" y="43" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="900" letter-spacing="-0.03em">
    Expense
  </text>
  
  <!-- Punto de acento esmeralda -->
  <circle cx="192" cy="36" r="5" fill="#10b981" />
</svg>
